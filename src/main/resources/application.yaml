server:
  port: 8081
organization:
  ingest-data: false
app:
  rag:
    reranker:
      enabled: true
      api-key: ${NVIDIA_API_KEY}
      base-url: https://ai.api.nvidia.com
      path: /v1/retrieval/nvidia/llama-nemotron-rerank-1b-v2/reranking
      model: nvidia/llama-nemotron-rerank-1b-v2
      candidate-count: 8
      top-k: 1
      timeout: 20s
      fail-open: true
